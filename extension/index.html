<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-v4.css">
</head>
<body>
<div class="container">

  <!-- ===================== HERO：时钟 + 日期 + 搜索 ===================== -->
  <header class="hero">
    <div class="clock" id="clock">--:--</div>
    <div class="hero-date" id="heroDate"></div>
    <form class="search" id="searchForm" autocomplete="off">
      <svg class="glogo" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <input id="searchInput" type="text" placeholder="在 Google 中搜索，或输入网址" spellcheck="false" autocomplete="off">
    </form>
  </header>

  <!-- ===================== 常用网站 ===================== -->
  <section class="quick-access-section" id="quickAccessSection">
    <div class="qa-actions">
      <button class="qa-icon-btn" id="qaEditBtn" title="编辑常用网站">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"/></svg>
      </button>
      <button class="qa-icon-btn" id="qaAddBtn" title="添加常用网站">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      </button>
    </div>
    <div class="quick-access-grid" id="quickAccessGrid"></div>
    <div class="qa-add-form" id="qaAddForm" style="display:none">
      <div class="qa-form-inner">
        <input type="text" id="qaNameInput" placeholder="网站名称" class="qa-input" maxlength="24">
        <input type="url" id="qaUrlInput" placeholder="网址，如 https://bilibili.com" class="qa-input">
        <div class="qa-form-actions">
          <button class="qa-confirm-btn" id="qaConfirmBtn">添加</button>
          <button class="qa-cancel-btn" id="qaCancelBtn">取消</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===================== 打开的标签页 + 稍后查看 ===================== -->
  <div class="dashboard-columns" id="dashboardColumns">
    <div class="active-section" id="openTabsSection" style="display:none">
      <div class="section-header">
        <h2 id="openTabsSectionTitle">打开的标签页</h2>
        <div class="section-line"></div>
        <div class="section-count" id="openTabsSectionCount"></div>
      </div>
      <div class="missions" id="openTabsMissions"></div>
    </div>

    <div class="deferred-column" id="deferredColumn" style="display:none">
      <div class="section-header">
        <h2>稍后查看</h2>
        <div class="section-line"></div>
        <div class="section-count" id="deferredCount"></div>
      </div>
      <div class="deferred-list" id="deferredList"></div>
      <div class="deferred-empty" id="deferredEmpty" style="display:none">没有待查看的内容</div>
      <div class="deferred-archive" id="deferredArchive" style="display:none">
        <button class="archive-toggle" id="archiveToggle">
          <svg class="archive-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
          已归档
          <span class="archive-count" id="archiveCount"></span>
        </button>
        <div class="archive-body" id="archiveBody" style="display:none">
          <input type="text" class="archive-search" id="archiveSearch" placeholder="搜索已归档的标签页">
          <div class="archive-list" id="archiveList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== 重复 Tab Out 标签提示（功能需要，平时隐藏） ===================== -->
  <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
    <div class="tab-cleanup-text">有 <strong id="tabOutDupeCount"></strong> 个新标签页开着，只保留当前这个？</div>
    <button class="tab-cleanup-btn" data-action="close-tabout-dupes">关闭多余的</button>
  </div>

  <footer>
    <div class="footer-stats">
      <div class="stat"><div class="stat-num" id="statTabs">—</div><div class="stat-label">已开标签页</div></div>
    </div>
  </footer>
</div>

<div class="toast" id="toast">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
  <span id="toastText"></span>
</div>

<script src="config.local.js" onerror="/* no personal config */"></script>
<script src="favicons-bundled.js"></script>
<script src="app.js"></script>
<script src="hero.js"></script>
</body>
</html>
